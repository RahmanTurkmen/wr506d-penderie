services:
  php:
    build:
      context: ./backend
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/var
    depends_on: [database]
  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./backend:/var/www/html", "./backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf"]
    depends_on: [php]
  database:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: lumen
      MARIADB_USER: app
      MARIADB_PASSWORD: ${DB_PASSWORD:-app_dev}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_dev}
    volumes: ["db_data:/var/lib/mysql"]
    ports: ["3306:3306"]
  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    volumes: ["./frontend:/app", "/app/node_modules"]
    # Pas de VITE_API_URL ici : le front déduit l'URL de l'API à partir de
    # l'hôte utilisé pour le charger (cf. frontend/src/lib/api.js), pour
    # marcher aussi bien en localhost que depuis un téléphone sur le même
    # réseau. Décommenter pour forcer une URL précise si besoin.
    # environment:
    #   VITE_API_URL: "http://localhost:8080"
    ports: ["5173:5173"]
    depends_on: [nginx]
volumes:
  db_data:
