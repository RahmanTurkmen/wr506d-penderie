server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        internal;
        # Le scan photo (/api/objets/scan) interroge plusieurs IA de vision
        # gratuites à la suite, et c'est parfois lent : on laisse plus de
        # marge que le défaut nginx (60s) pour ne pas couper la requête en
        # plein milieu (ce qui ressemble à une erreur réseau côté front).
        fastcgi_read_timeout 90s;
        fastcgi_send_timeout 90s;
    }

    location ~ \.php$ {
        return 404;
    }

    error_log /var/log/nginx/lumen_error.log;
    access_log /var/log/nginx/lumen_access.log;
}
