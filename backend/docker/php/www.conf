; Pool php-fpm pour le développement local. La valeur par défaut de l'image
; (pm.max_children = 5) sature vite en dev : le dashboard/l'inventaire tirent
; plusieurs requêtes API en parallèle (objets, catégories, tags, logements,
; prêts...), et une campagne Cypress qui enchaîne plusieurs scénarios peut
; largement dépasser 5 requêtes concurrentes, ce qui fait mettre les
; suivantes en attente (lenteur perçue, voire timeouts côté tests e2e).
[www]
user = www-data
group = www-data
listen = 9000
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
